<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b8bd5;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#5b9a63;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad1)" stroke="#e5e7eb" stroke-width="2" rx="8" />

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f3f4f6" stroke-width="1" opacity="0.5" />
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" rx="8" />
</svg>