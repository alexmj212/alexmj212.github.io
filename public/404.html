<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Alex Johnson - Senior Front-End Software Engineer</title>
    <meta http-equiv="refresh" content="0; url=/">
    <script>
      // GitHub Pages SPA redirect solution
      // Store the path so the app can navigate to it after loading
      sessionStorage.setItem('gh-pages-redirect', location.pathname + location.search + location.hash);
      location.replace('/');
    </script>
  </head>
  <body>
    <!-- This will only show if JavaScript is disabled -->
    <noscript>
      <p>Redirecting to homepage...</p>
      <a href="/">Click here if not redirected automatically</a>
    </noscript>
  </body>
</html>
