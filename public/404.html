<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Store the path in sessionStorage and redirect to index.html
      // index.html will restore the path using history.replaceState
      (function() {
        var l = window.location;
        sessionStorage.redirect = l.href;
        l.replace(l.origin);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
